[package]
name = "ats-llm"
version = "0.1.0"
edition = "2024"
description = "Reusable web-search and free-LLM discovery library"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
